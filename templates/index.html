<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NexTrade | Trade Everything</title>
    <meta
      name="description"
      content="NexTrade dark-mode digital asset exchange with crypto, points, and NFT trading workflows."
    >
    <script src="https://cdn.tailwindcss.com?plugins=typography,forms"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              canvas: "#0D1117",
              panel: "#101926",
              electric: "#007BFF",
              growth: "#00C853",
              nft: "#9C27B0"
            },
            boxShadow: {
              glowBlue: "0 0 0 1px rgba(0,123,255,0.28), 0 0 42px rgba(0,123,255,0.22)",
              glowGreen: "0 0 28px rgba(0,200,83,0.35)",
              glowPurple: "0 0 28px rgba(156,39,176,0.35)"
            }
          }
        }
      };
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/nextrade-react.css') }}">
  </head>
  <body class="bg-canvas text-white antialiased">
    <div id="root"></div>

    <script>
      window.NEXTRADE_CONFIG = {{ {
        "urls": {
          "home": url_for('index'),
          "explore": url_for('explore'),
          "howItWorks": url_for('how_it_works'),
          "portfolio": url_for('portfolio'),
          "buyCrypto": url_for('buy_crypto'),
          "sellPoints": url_for('sell_points'),
          "nftMarketplace": url_for('nft_marketplace'),
          "login": url_for('login'),
          "register": url_for('register'),
          "logout": url_for('logout')
        },
        "user": {
          "isAuthenticated": session.get('user_id') is not none,
          "username": session.get('username')
        }
      } | tojson }};
    </script>
    <script type="module" src="{{ url_for('static', filename='js/nextrade/main.js') }}"></script>
  </body>
</html>

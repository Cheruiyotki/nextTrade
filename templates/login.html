{% extends "layout.html" %}

{% block title %}Nextrade | Login{% endblock %}

{% block content %}
  <h1>Login</h1>
  <p class="nx-muted">Access your Nextrade dashboard, portfolio, and market actions.</p>

  <form class="nx-form" method="post">
    <input name="username" placeholder="Username" required>
    <input name="password" type="password" placeholder="Password" required>
    <button class="nx-btn" type="submit">Login</button>
  </form>

  <div class="nx-inline-links">
    <a href="{{ url_for('register') }}">Need an account? Register</a>
  </div>
{% endblock %}

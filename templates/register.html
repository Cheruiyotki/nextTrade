{% extends "layout.html" %}

{% block title %}Nextrade | Register{% endblock %}

{% block content %}
  <h1>Create Account</h1>
  <p class="nx-muted">Start trading crypto, points, and NFTs in one secure workflow.</p>

  <form class="nx-form" method="post">
    <input name="username" placeholder="Username" required>
    <input name="email" type="email" placeholder="Email" required>
    <input name="password" type="password" placeholder="Password" required>
    <input name="confirm_password" type="password" placeholder="Confirm Password" required>
    <button class="nx-btn" type="submit">Register</button>
  </form>

  <div class="nx-inline-links">
    <a href="{{ url_for('login') }}">Already have an account? Login</a>
  </div>
{% endblock %}
